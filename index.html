<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prudentix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Welcome to Prudentix</h1>
    <p id="message">Click a button to get started.</p>

    <div class="buttons">
      <button id="greetBtn">Say Hello</button>
      <button id="countBtn">Count: <span id="count">0</span></button>
      <button id="themeBtn">Toggle Theme</button>
      <button id="resetBtn" class="secondary">Reset</button>
      <button id="loginBtn" class="login">Login</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
